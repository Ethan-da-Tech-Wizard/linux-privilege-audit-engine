# ==============================================================================
# Linux Privilege Escalation Auditor Engine — Build & Packaging Specification
# ==============================================================================
# Architecture & Governance:
#   Package specification for the deterministic zero-dependency root execution
#   privilege auditor and least-privilege compliance scanner.
#
# Ownership & Licensing:
#   Author: Ethan Kilmer <ethan@twu.software>
#   Organization: TWU LLC
#   License: MIT License (2026)
# ==============================================================================

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-privilege-audit-engine"
version = "1.0.0"
description = "Python project for auditing potentially unsafe privileged execution paths."
readme = "README.md"
authors = [
  { name = "Ethan Kilmer", email = "ethan@twu.software" },
  { name = "TWU LLC" }
]
license = { text = "MIT" }
keywords = [
  "security",
  "privilege-escalation",
  "systemd",
  "sudoers",
  "audit",
  "linux-security",
  "least-privilege",
  "devsecops",
  "gtfobins"
]
classifiers = [
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration"
]
requires-python = ">=3.10"

[project.scripts]
privilege-audit = "scripts.root_exec_audit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
