# ==============================================================================
# Linux Privilege Escalation Auditor Engine — Build & Packaging Specification
# ==============================================================================
# Architecture & Governance:
#   Package specification for the deterministic zero-dependency root execution
#   privilege auditor and least-privilege compliance scanner.
#
# Ownership & Licensing:
#   Author: Ethan Kilmer <ethan@twu.software>
#   Organization: TWU LLC
#   License: MIT License (2026)
# ==============================================================================

# Build backend: plain setuptools; the project has no runtime dependencies.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Core metadata. There is no `dependencies` key: the auditor uses only the standard library, so it can run on a locked-down host.
[project]
name = "linux-privilege-audit-engine"
version = "1.0.0"
description = "Python project for auditing potentially unsafe privileged execution paths."
readme = "README.md"
authors = [
  { name = "Ethan Kilmer", email = "ethan@twu.software" },
  { name = "TWU LLC" }
]
license = { text = "MIT" }
# Search keywords for package indexes (no effect on behaviour).
keywords = [
  "security",
  "privilege-escalation",
  "systemd",
  "sudoers",
  "audit",
  "linux-security",
  "least-privilege",
  "devsecops",
  "gtfobins"
]
# Trove classifiers: audience, topic, supported Python versions; Linux is the target, macOS is accepted for development.
classifiers = [
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration"
]
# Matches the CI matrix (3.10 through 3.13).
requires-python = ">=3.10"

# Installs a 'privilege-audit' command that calls scripts.root_exec_audit.main().
[project.scripts]
privilege-audit = "scripts.root_exec_audit:main"

# Package only the scripts/ directory; the tests live there too but nothing else is shipped.
[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
