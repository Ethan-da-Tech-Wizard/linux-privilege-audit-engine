# ==============================================================================
# linux-privilege-audit-engine: build and packaging metadata
# ==============================================================================
# Packaging for a read-only checker that reports files root runs or sources and that a
# non-root user could modify. Standard library only. Findings are leads, not proof.
# Author: Ethan-da-Tech-Wizard (GitHub). License: MIT, see LICENSE.
# ==============================================================================

# Build backend: plain setuptools; the project has no runtime dependencies.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Core metadata. There is no `dependencies` key: the auditor uses only the standard library, so it can run on a locked-down host.
[project]
name = "linux-privilege-audit-engine"
version = "1.0.0"
description = "Read-only checker for files that root runs or sources and a non-root user could modify."
readme = "README.md"
authors = [
  { name = "Ethan-da-Tech-Wizard" }
]
license = { text = "MIT" }
# Search keywords for package indexes (no effect on behaviour).
keywords = [
  "security",
  "privilege-escalation",
  "systemd",
  "sudoers",
  "audit",
  "linux-security",
  "least-privilege",
  "gtfobins"
]
# Trove classifiers: audience, topic, supported Python versions; Linux is the target, macOS is accepted for development.
classifiers = [
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration"
]
# CI runs 3.9 and 3.13; the unit tests also pass on 3.9 locally.
requires-python = ">=3.9"

# Installs a 'privilege-audit' command that calls scripts.root_exec_audit.main().
[project.scripts]
privilege-audit = "scripts.root_exec_audit:main"

# Package only the scripts/ directory; the tests live there too but nothing else is shipped.
[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
