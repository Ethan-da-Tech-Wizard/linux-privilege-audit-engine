name: Bug report or wrong finding
description: The tool crashed, missed something it should catch, or flagged something it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command, and a minimal fake tree if possible. Remove private paths and names.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Raw output
      render: text
