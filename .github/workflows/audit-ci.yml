# ==============================================================================
# Linux Privilege Escalation Auditor — Automated CI/CD & Security Matrix
# ==============================================================================
# Architecture & DevSecOps Guarantees:
#   This GitHub Actions workflow validates the static privilege auditor across
#   supported Python runtimes (3.10, 3.11, 3.12, 3.13) to ensure zero-dependency
#   compatibility and regression-free privilege escalation detection.
#
# Ownership & Licensing:
#   Author: Ethan Kilmer <ethan@twu.software>
#   Organization: TWU LLC
#   License: MIT License (2026)
#
# Core Stages:
#   1. Static Code Analysis & Syntax Validation (py_compile, AST checks)
#   2. Multi-Version Python Compatibility Test Matrix (Python 3.10 - 3.13)
#   3. Live Self-Audit Smoke Execution (Verifying zero-crash CLI behavior)
# ==============================================================================

name: Linux Privilege Escalation Auditor CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Enforce the Principle of Least Privilege (PoLP) on the default GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Static Code Quality & Syntax Compilation Check
  # ============================================================================
  lint:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile Python Modules
        run: |
          python3 -m py_compile scripts/root_exec_audit.py
          python3 -m py_compile scripts/test_root_exec_audit.py

  # ============================================================================
  # Stage 2: Multi-Version Test Matrix (Python 3.10 - 3.13)
  # ============================================================================
  test-matrix:
    name: Regression Suite (Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Execute Adversarial Unit Test Suite (51 Tests)
        run: |
          python3 -B -m unittest -v scripts/test_root_exec_audit.py

      - name: Live Self-Audit Smoke Test
        run: |
          # Verify that running on a live Linux runner executes cleanly, produces
          # valid schema JSON output, and handles unprivileged /etc/sudoers reading.
          python3 -B scripts/root_exec_audit.py --json > audit_out.json || true
          python3 -c "import json; d = json.load(open('audit_out.json')); assert d['schema'] == 'twu.root-exec-audit.v1'; print('Audit verified:', len(d['findings']), 'findings detected')"
          rm -f audit_out.json
